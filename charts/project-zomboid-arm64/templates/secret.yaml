{{- if not .Values.secret.existingName }}
{{- if empty .Values.secret.adminPassword }}
{{- fail "secret.adminPassword must be set, or use secret.existingName" }}
{{- end }}
{{- if empty .Values.secret.serverPassword }}
{{- fail "secret.serverPassword must be set, or use secret.existingName" }}
{{- end }}
{{- if empty .Values.secret.rconPassword }}
{{- fail "secret.rconPassword must be set, or use secret.existingName" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pz.secretName" . }}
  labels:
    {{- include "pz.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.keys.adminPassword }}: {{ .Values.secret.adminPassword | quote }}
  {{ .Values.secret.keys.serverPassword }}: {{ .Values.secret.serverPassword | quote }}
  {{ .Values.secret.keys.rconPassword }}: {{ .Values.secret.rconPassword | quote }}
{{- end }}
