nameOverride: ""
fullnameOverride: ""
commonLabels: {}

image:
  repository: ghcr.io/kernelpanic53/project-zomboid-arm64
  tag: experimental-fex
  digest: ""
  pullPolicy: Always
imagePullSecrets: []

server:
  name: servertest
  displayName: "Project Zomboid ARM64 (experimental FEX)"
  branch: public
  public: false
  port: 16261
  udpPort: 16262
  steamPort1: 8766
  steamPort2: 8767
  rconPort: 27015
  memory: 4G
  memoryXms: ""
  memoryXmx: ""
  updateOnStart: true
  adminUsername: admin
  debug: false
  noSteam: true
  workshopIds: ""
  modIds: ""
  javaExtraArgs: ""
  jvmExtraArgs: ""
  # FEX's interpreter mode is the safer experimental default for current PZ
  # Build 42/JVM 25 reports, but can be extremely slow. Options: interpreter,
  # c1, default. Test C1/default on your workload before exposing the server.
  fexJitMode: interpreter

fex:
  # Current FEX/PZ reports indicate that disabling multiblock may help with
  # some JIT failures, but does not guarantee Build 42 stability.
  multiblock: "0"

secret:
  # Prefer creating this Secret outside Helm so passwords are not stored in Helm history.
  existingName: ""
  adminPassword: ""
  serverPassword: ""
  rconPassword: ""
  keys:
    adminPassword: admin-password
    serverPassword: server-password
    rconPassword: rcon-password

service:
  type: LoadBalancer
  annotations: {}
  labels: {}
  loadBalancerClass: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""
  allocateLoadBalancerNodePorts: null
  nodePorts:
    game: null
    game2: null
    steam1: null
    steam2: null
    rcon: null

persistence:
  server:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    annotations: {}
    selector: {}
  config:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 4Gi
    annotations: {}
    selector: {}

podAnnotations: {}
podLabels: {}
automountServiceAccountToken: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi

startupProbe:
  enabled: true
  failureThreshold: 90
  periodSeconds: 10
  timeoutSeconds: 5
readinessProbe:
  enabled: true
  failureThreshold: 6
  periodSeconds: 15
  timeoutSeconds: 5
livenessProbe:
  enabled: true
  failureThreshold: 6
  periodSeconds: 30
  timeoutSeconds: 5

terminationGracePeriodSeconds: 120
updateStrategy:
  type: RollingUpdate

# Generic ARM64 scheduling; no host-specific nodeSelector.
nodeSelector:
  kubernetes.io/arch: arm64
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""
schedulerName: ""

emptyDir:
  tmp: {}
