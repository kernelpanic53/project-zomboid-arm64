name: Build and Test Project Zomboid ARM64

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kernelpanic53/project-zomboid-arm64

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell syntax
        run: |
          bash -n scripts/entrypoint.sh
          bash -n scripts/healthcheck.sh

      - name: ShellCheck
        run: |
          shellcheck scripts/entrypoint.sh
          shellcheck scripts/healthcheck.sh

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Helm lint
        run: |
          helm lint charts/project-zomboid-arm64 \
            --set-string secret.adminPassword=github-actions-test-password \
            --set-string secret.serverPassword=github-actions-test-password \
            --set-string secret.rconPassword=github-actions-test-password

      - name: Helm template
        run: |
          helm template zomboid \
            charts/project-zomboid-arm64 \
            --namespace zomboid \
            --set-string secret.adminPassword=github-actions-test-password \
            --set-string secret.serverPassword=github-actions-test-password \
            --set-string secret.rconPassword=github-actions-test-password \
            > /tmp/zomboid-rendered.yaml

      - name: Validate rendered Kubernetes YAML
        run: |
          test -s /tmp/zomboid-rendered.yaml
          grep -q "kind: StatefulSet" /tmp/zomboid-rendered.yaml
          grep -q "kind: Service" /tmp/zomboid-rendered.yaml


  build:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          tags: |
            zomboid-arm64:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image architecture
        run: |
          docker image inspect zomboid-arm64:test \
            --format '{{.Os}}/{{.Architecture}}' \
            | grep -q '^linux/arm64$'

      - name: Display image information
        run: |
          echo "ARM64 image successfully built."
          echo
          docker image inspect zomboid-arm64:test \
            --format 'Image: {{.RepoTags}}'
          docker image inspect zomboid-arm64:test \
            --format 'Architecture: {{.Architecture}}'
          docker image inspect zomboid-arm64:test \
            --format 'OS: {{.Os}}'
          docker image inspect zomboid-arm64:test \
            --format 'Size: {{.Size}} bytes'


  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-24.04-arm
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push ARM64 image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate image attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
